<header class="top-bar" [class.top-bar--with-parent]="parent()">
  @if (parent(); as parent) {
    <button
      class="parent-button"
      type="button"
      appButton
      variant="icon"
      [attr.aria-label]="'Volver a ' + parent.label"
      (click)="goToParent()"
    >
      <app-icon name="arrow_back" />
    </button>
  }
  <div class="identity">
    <h1>{{ title() }}</h1>
    <!-- Línea de contexto: el grupo lo pone la barra (es global), el resto lo
         pone la página. Así el grupo no gasta una columna propia y el título
         se queda con todo el ancho. -->
    <span class="identity__context">{{ contextLine() }}</span>
  </div>

  <button
    appButton
    variant="icon"
    class="avatar-button"
    type="button"
    [appMenuTriggerFor]="userMenu"
    aria-label="Tu cuenta"
  >
    <app-avatar [name]="user()?.name ?? ''" />
  </button>
</header>

<ng-template #userMenu>
  <app-menu aria-label="Tu cuenta">
    <div class="user-menu__head">
      <span class="user-menu__name">{{ user()?.name }}</span>
      <span class="user-menu__email">{{ user()?.email }}</span>
    </div>

    <button appMenuItem (triggered)="joinGroup()">
      <app-icon name="group_add" />
      <span>Unirme a un grupo</span>
    </button>

    <button appMenuItem (triggered)="logout()">
      <app-icon name="logout" />
      <span>Cerrar sesión</span>
    </button>
  </app-menu>
</ng-template>
