<header class="top-bar">
  <div class="identity">
    <h1>{{ title() }}</h1>
    <!-- Línea de contexto: el grupo lo pone la barra (es global), el resto lo
         pone la página. Así el grupo no gasta una columna propia y el título
         se queda con todo el ancho. -->
    <span class="identity__context">{{ contextLine() }}</span>
  </div>

  <!-- El botón es el círculo. Con matIconButton no encajaba: mide 40px con 8px
       de padding para un icono de 24, así que un círculo de 32 se salía por la
       derecha y por abajo, y el foco seguía la caja del botón, no el círculo. -->
  <button class="avatar-button" type="button" [matMenuTriggerFor]="userMenu" aria-label="Tu cuenta">
    <app-avatar [name]="user()?.name ?? ''" />
  </button>
</header>

<mat-menu #userMenu="matMenu">
  <div class="user-menu__head">
    <span class="user-menu__name">{{ user()?.name }}</span>
    <span class="user-menu__email">{{ user()?.email }}</span>
  </div>

  <!-- Cambiar de grupo desde cualquier pantalla, sin gastar cromo permanente. -->
  <button mat-menu-item (click)="openGroupSwitcher()">
    <mat-icon>groups</mat-icon>
    <span>Grupo: {{ groupName() }}</span>
  </button>

  <button mat-menu-item (click)="joinGroup()">
    <mat-icon>group_add</mat-icon>
    <span>Unirme a un grupo</span>
  </button>

  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
</mat-menu>
