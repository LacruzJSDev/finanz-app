<a
  class="navigate-button"
  [class.navigate-button--disabled]="!activeGroupId()"
  [routerLink]="activeGroupId() ? '/dashboard' : null"
  routerLinkActive="navigate-button--active"
  [routerLinkActiveOptions]="{ exact: true }"
  aria-label="Resumen"
  ariaCurrentWhenActive="page"
  [attr.aria-disabled]="!activeGroupId() || null"
>
  <app-icon name="dashboard" />
</a>

<a
  class="navigate-button"
  routerLink="/grupos"
  routerLinkActive="navigate-button--active"
  aria-label="Grupos"
  ariaCurrentWhenActive="page"
>
  <app-icon name="groups" />
</a>

<span class="fab-slot" [class.fab-slot--hidden]="!action()" [attr.inert]="!action() ? '' : null">
  <button
    appButton
    variant="fab"
    class="fab"
    aria-label="Acción de la página"
    [attr.aria-hidden]="!action()"
    (click)="action()?.onClick()"
    [disabled]="!action()"
  >
    <app-icon [name]="action()?.icon" />
  </button>
</span>

<a
  class="navigate-button"
  [class.navigate-button--disabled]="!activeGroupId()"
  [routerLink]="activeGroupId() ? '/cuentas' : null"
  routerLinkActive="navigate-button--active"
  aria-label="Cuentas"
  ariaCurrentWhenActive="page"
  [attr.aria-disabled]="!activeGroupId() || null"
>
  <app-icon name="account_balance_wallet" />
</a>

<a
  class="navigate-button"
  [class.navigate-button--disabled]="!activeGroupId()"
  [routerLink]="activeGroupId() ? '/presupuestos' : null"
  routerLinkActive="navigate-button--active"
  aria-label="Presupuestos"
  ariaCurrentWhenActive="page"
  [attr.aria-disabled]="!activeGroupId() || null"
>
  <app-icon name="savings" />
</a>
