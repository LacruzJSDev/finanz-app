<a
  class="navigate-button"
  [class.navigate-button--disabled]="!activeGroupId()"
  [routerLink]="activeGroupId() ? '/dashboard' : null"
  routerLinkActive="navigate-button--active"
  [routerLinkActiveOptions]="{ exact: true }"
  aria-label="Resumen"
  ariaCurrentWhenActive="page"
  [attr.aria-disabled]="!activeGroupId() || null"
>
  <mat-icon>dashboard</mat-icon>
</a>

<a
  class="navigate-button"
  routerLink="/grupos"
  routerLinkActive="navigate-button--active"
  aria-label="Grupos"
  ariaCurrentWhenActive="page"
>
  <mat-icon>groups</mat-icon>
</a>

<!-- La acción de la página. Se encoge hasta desaparecer cuando no hay ninguna,
     en vez de quitarse de golpe y dar un salto a los iconos de al lado. -->
<button
  matMiniFab
  class="fab"
  [class.fab--hidden]="!action()"
  [attr.aria-hidden]="!action()"
  (click)="action()?.onClick()"
  [disabled]="!action()"
>
  <mat-icon>{{ action()?.icon }}</mat-icon>
</button>

<a
  class="navigate-button"
  [class.navigate-button--disabled]="!activeGroupId()"
  [routerLink]="activeGroupId() ? '/cuentas' : null"
  routerLinkActive="navigate-button--active"
  aria-label="Cuentas"
  ariaCurrentWhenActive="page"
  [attr.aria-disabled]="!activeGroupId() || null"
>
  <mat-icon>account_balance_wallet</mat-icon>
</a>

<a
  class="navigate-button"
  [class.navigate-button--disabled]="!activeGroupId()"
  [routerLink]="activeGroupId() ? '/presupuestos' : null"
  routerLinkActive="navigate-button--active"
  aria-label="Presupuestos"
  ariaCurrentWhenActive="page"
  [attr.aria-disabled]="!activeGroupId() || null"
>
  <mat-icon>savings</mat-icon>
</a>
