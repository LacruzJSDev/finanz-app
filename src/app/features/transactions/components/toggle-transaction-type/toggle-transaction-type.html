@if (options().length > 1) {
  <div class="segmented-track">
    <mat-button-toggle-group [formControl]="control()">
      @for (type of options(); track type) {
        <mat-button-toggle [value]="type">{{ type | transactionTypeLabel }}</mat-button-toggle>
      }
    </mat-button-toggle-group>
  </div>
} @else {
  <p class="type-label">{{ options()[0] | transactionTypeLabel }}</p>
}
