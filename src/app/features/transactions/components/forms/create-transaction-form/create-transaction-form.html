<h2>Nuevo movimiento</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <select formControlName="type">
    @for (type of transactionTypes; track type) {
      <option [value]="type">{{ type | transactionTypeLabel }}</option>
    }
  </select>

  <input type="number" step="0.01" formControlName="amount" placeholder="Importe" />
  <input type="date" formControlName="date" />
  <input type="text" formControlName="notes" placeholder="Notas" />

  @if (type() === 'transfer') {
    <select formControlName="to_account_id">
      @for (account of data.otherAccounts; track account.id) {
        <option [value]="account.id">{{ account.name }}</option>
      }
    </select>
  } @else {
    <select formControlName="category_id">
      <option value="">Sin categoría</option>
      @for (category of data.categories; track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
  }

  <button type="submit">Guardar</button>
</form>
