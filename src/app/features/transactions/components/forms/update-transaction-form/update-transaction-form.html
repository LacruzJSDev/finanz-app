<h2>Editar movimiento</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <app-toggle-transaction-type [control]="form.controls.type" [options]="transactionTypes" />
  <app-amount-input [control]="form.controls.amount" [type]="type()" />

  <div class="grouped-card">
    <mat-form-field>
      <mat-label>Fecha</mat-label>
      <input
        matInput
        [matDatepicker]="datePicker"
        formControlName="date"
        (click)="datePicker.open()"
      />
      <mat-datepicker-toggle matIconSuffix [for]="datePicker" />
      <mat-datepicker #datePicker />
      <mat-error>{{
        form.controls.date.getError('server') ?? 'La fecha es obligatoria.'
      }}</mat-error>
    </mat-form-field>

    @if (type() !== 'transfer') {
      <app-category-select [control]="form.controls.category_id" [categories]="data.categories" />
    }

    <mat-form-field>
      <mat-label>Notas</mat-label>
      <input matInput type="text" formControlName="notes" />
    </mat-form-field>
  </div>
  <p class="form-error">{{ formError() }}</p>

  <button matButton="filled" type="submit" [disabled]="submitting()">
    @if (submitting()) {
      <mat-spinner diameter="20" />
    } @else {
      Guardar {{ type() | transactionTypeLabel | lowercase }}
    }
  </button>
</form>
