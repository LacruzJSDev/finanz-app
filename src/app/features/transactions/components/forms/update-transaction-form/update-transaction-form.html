<h2>Editar movimiento</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <app-toggle-transaction-type [control]="form.controls.type" [options]="transactionTypes" />
  <app-amount-input [control]="form.controls.amount" [type]="type()" />

  <div class="grouped-card">
    <mat-form-field>
      <mat-label>Fecha</mat-label>
      <input
        matInput
        [matDatepicker]="datePicker"
        formControlName="date"
        (click)="datePicker.open()"
      />
      <mat-datepicker-toggle matIconSuffix [for]="datePicker" />
      <mat-datepicker #datePicker />
    </mat-form-field>

    @if (type() !== 'transfer') {
      <mat-form-field>
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="category_id">
          <mat-select-trigger>
            <app-color-icon [icon]="selectedCategory()?.icon" [color]="selectedCategory()?.color" />
            {{ selectedCategory()?.name ?? 'Sin categoría' }}
          </mat-select-trigger>
          <mat-option value="">
            <app-color-icon />
            Sin categoría
          </mat-option>
          @for (category of data.categories; track category.id) {
            <mat-option [value]="category.id">
              <app-color-icon [icon]="category.icon" [color]="category.color" />
              {{ category.name }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    }

    <mat-form-field>
      <mat-label>Notas</mat-label>
      <input matInput type="text" formControlName="notes" />
    </mat-form-field>
  </div>

  <button matButton="filled" type="submit">
    Guardar {{ type() | transactionTypeLabel | lowercase }}
  </button>
</form>
