<h2>Eliminar movimiento</h2>
<p>¿Seguro que quieres eliminar este movimiento? Esta acción no se puede deshacer.</p>
<div class="actions">
  <button appButton variant="text" (click)="cancel()" [disabled]="submitting()">Cancelar</button>
  <button
    appButton
    variant="filled"
    class="delete-button"
    (click)="submit()"
    [disabled]="submitting()"
  >
    @if (submitting()) {
      <app-loader diameter="20" />
    } @else {
      Eliminar
    }
  </button>
</div>
