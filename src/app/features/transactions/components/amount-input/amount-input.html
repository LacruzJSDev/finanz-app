<div class="amount" [class]="'amount--' + type()">
  <span class="amount-sign">
    {{ type() === 'expense' ? '−' : type() === 'income' ? '+' : '' }}
  </span>
  <mat-form-field class="amount-field">
    <input matInput type="number" step="0.01" placeholder="0" [formControl]="control()" />
  </mat-form-field>
  <span class="amount-currency">€</span>
</div>
