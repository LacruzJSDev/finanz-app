<div class="amount" [class]="'amount--' + type()">
  <span class="amount-sign">
    {{ type() === 'expense' ? '−' : type() === 'income' ? '+' : '' }}
  </span>
  <app-text-input
    class="amount-field"
    label="Importe"
    appearance="amount"
    type="number"
    step="0.01"
    placeholder="0"
    [formControl]="control()"
  />
  <span class="amount-currency">€</span>
</div>
