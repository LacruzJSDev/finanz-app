<app-page-content>
  <div class="transaction-filters">
    <app-select label="Categoría" [options]="categoryOptions()" [formControl]="categoryControl" />

    <div class="transaction-search">
      <app-text-input
        label="Concepto"
        type="search"
        autocomplete="off"
        [formControl]="searchControl"
      />
      @if (search()) {
        <button
          appButton
          variant="icon"
          aria-label="Limpiar búsqueda"
          (click)="searchControl.setValue('')"
        >
          <app-icon name="close" />
        </button>
      }
    </div>
  </div>

  @if (loading()) {
    <app-page-loader />
  } @else if (transactions().length) {
    <app-transactions-list
      [transactions]="transactions()"
      [categories]="categories()"
      (rowClick)="openUpdateTransactionForm($event)"
      (deleteClick)="deleteTransaction($event)"
    />

    <!-- Centinela: al acercarse pide la página siguiente. Ocupa sitio siempre
         para que el hueco no dé un salto cuando aparece el spinner. -->
    <div class="load-more" appInfiniteScroll [disabled]="!canLoadMore()" (reached)="loadMore()">
      @if (loadingMore()) {
        <app-loader diameter="24" />
      } @else if (!hasMore()) {
        <span class="load-more__end">No hay más movimientos</span>
      }
    </div>
  } @else {
    @if (hasFilters()) {
      <div class="filtered-empty">
        <app-empty-state
          icon="search_off"
          message="No hay movimientos que coincidan."
          hint="Prueba a cambiar o limpiar los filtros."
        />
        <button appButton variant="outlined" (click)="clearFilters()">Limpiar filtros</button>
      </div>
    } @else {
      <app-empty-state
        icon="receipt_long"
        message="Esta cuenta no tiene movimientos."
        hint="Añade el primero con el botón +."
      />
    }
  }
</app-page-content>
