<div class="page-content">
  @if (group(); as g) {
    <h1>{{ g.name }}</h1>
    <p>{{ g.is_active ? 'Activo' : 'Archivado' }}</p>
    <p [style.backgroundColor]="g.color">{{ g.color ? 'color' : 'Sin color' }}</p>
  } @else {
    <div class="empty-state">
      <mat-icon>search_off</mat-icon>
      <p>Grupo no encontrado.</p>
    </div>
  }
</div>
