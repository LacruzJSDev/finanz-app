<div class="segmented-track">
  <app-segmented-control
    [options]="filterOptions"
    [value]="filter()"
    (valueChange)="setFilter($event)"
  />
</div>

<app-page-content>
  @if (loading()) {
    <app-page-loader />
  } @else if (visibleGroups().length) {
    <app-account-groups-list
      [accountGroups]="visibleGroups()"
      [activeGroupId]="activeGroupId()"
      (showClick)="showDetail($event.id)"
      (analysisClick)="showAnalysis($event.id)"
    />
  } @else if (filter() === 'active') {
    <app-empty-state
      icon="groups"
      message="No hay grupos activos."
      hint="Crea el primero con el botón +."
    />
  } @else {
    <app-empty-state
      icon="groups"
      message="No hay grupos archivados."
      hint="Los grupos que archives aparecerán aquí."
    />
  }
</app-page-content>
