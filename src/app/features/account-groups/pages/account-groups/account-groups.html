<div class="segmented-track">
  <mat-button-toggle-group [value]="filter()" (change)="filter.set($event.value)">
    <mat-button-toggle value="active">Activos</mat-button-toggle>
    <mat-button-toggle value="archived">Archivados</mat-button-toggle>
  </mat-button-toggle-group>
</div>

<div class="page-content">
  @if (loading()) {
    <div class="page-loader"><mat-spinner diameter="36" /></div>
  } @else {
    @for (group of visibleGroups(); track group.id) {
      <app-account-group-card
        [accountGroup]="group"
        [activeGroupId]="activeGroupId()"
        (showClick)="showDetail($event.id)"
        (workingGroupChange)="setWorkingGroup(group, $event)"
      />
    } @empty {
      <div class="empty-state">
        <mat-icon>groups</mat-icon>
        @if (filter() === 'active') {
          <p>No hay grupos activos.</p>
          <p class="empty-state-hint">Crea el primero con el botón +.</p>
        } @else {
          <p>No hay grupos archivados.</p>
          <p class="empty-state-hint">Los grupos que archives aparecerán aquí.</p>
        }
      </div>
    }
  }
</div>
