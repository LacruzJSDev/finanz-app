<mat-card appearance="outlined" (click)="showClick.emit(accountGroup())">
  <app-color-icon [icon]="accountGroup().icon" [color]="accountGroup().color" [size]="48" />

  <div class="group-info">
    <span class="group-name">{{ accountGroup().name }}</span>
    <span class="group-members">Miembros: {{ memberCount() }}</span>
  </div>

  @if (isWorkingGroup()) {
    <span class="group-context">En uso</span>
  }

  <button
    matIconButton
    [attr.aria-label]="'Ver análisis de ' + accountGroup().name"
    (click)="showAnalysis($event)"
  >
    <mat-icon>query_stats</mat-icon>
  </button>
</mat-card>
