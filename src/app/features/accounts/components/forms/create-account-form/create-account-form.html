<h2>Crear cuenta</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <app-input-group>
    <app-text-input
      label="Nombre"
      formControlName="name"
      [error]="
        form.controls.name.invalid &&
        (form.controls.name.touched || form.controls.name.hasError('server'))
          ? (form.controls.name.getError('server') ?? 'El nombre es obligatorio.')
          : null
      "
    />

    <app-select label="Tipo" [options]="accountTypeOptions" formControlName="type" />

    <app-text-input
      label="Saldo actual"
      type="number"
      step="0.01"
      formControlName="opening_balance"
      [error]="
        form.controls.opening_balance.invalid &&
        (form.controls.opening_balance.touched || form.controls.opening_balance.hasError('server'))
          ? (form.controls.opening_balance.getError('server') ?? 'El saldo es obligatorio.')
          : null
      "
    />

    <app-text-input
      label="Moneda"
      formControlName="currency"
      maxlength="3"
      [error]="
        form.controls.currency.invalid &&
        (form.controls.currency.touched || form.controls.currency.hasError('server'))
          ? (form.controls.currency.getError('server') ?? 'La moneda es obligatoria.')
          : null
      "
    />

    <app-color-picker [selected]="form.controls.color.value" (colorChange)="selectColor($event)" />

    <app-icon-picker [selected]="form.controls.icon.value" (iconChange)="selectIcon($event)" />
  </app-input-group>
  <p class="form-error">{{ formError() }}</p>

  <button appButton variant="filled" type="submit" [disabled]="submitting()">
    @if (submitting()) {
      <app-loader diameter="20" />
    } @else {
      Guardar
    }
  </button>
</form>
