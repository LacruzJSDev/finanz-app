@if (account(); as acc) {
  <h2>Balance: {{ acc.balance | centsToEuros: acc.currency }}</h2>
}

<div class="page-content">
  @if (transactions().length) {
    <app-transactions-list
      [transactions]="transactions()"
      [categories]="categories()"
      (rowClick)="openUpdateTransactionForm($event)"
      (deleteClick)="deleteTransaction($event)"
    />
    <app-paginator
      [total]="total()"
      [limit]="limit"
      [offset]="offset()"
      (pageChange)="onPageChange($event)"
    />
  }
</div>
