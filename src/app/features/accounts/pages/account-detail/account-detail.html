@if (section() !== 'analisis') {
  <nav class="segmented-track" aria-label="Secciones de la cuenta">
    <mat-button-toggle-group
      [value]="section()"
      (change)="router.navigate([$event.value], { relativeTo: route })"
    >
      <mat-button-toggle
        value="movimientos"
        [attr.aria-current]="section() === 'movimientos' ? 'page' : null"
        >Movimientos</mat-button-toggle
      >
      <mat-button-toggle
        value="planificados"
        [attr.aria-current]="section() === 'planificados' ? 'page' : null"
        >Planificados</mat-button-toggle
      >
    </mat-button-toggle-group>
  </nav>
}
<router-outlet />
