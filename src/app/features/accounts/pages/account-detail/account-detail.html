@if (section() !== 'analisis') {
  <nav class="segmented-track" aria-label="Secciones de la cuenta">
    <app-segmented-control
      [options]="sectionOptions"
      [value]="section() ?? null"
      (valueChange)="router.navigate([$event], { relativeTo: route })"
    />
  </nav>
}
<router-outlet />
