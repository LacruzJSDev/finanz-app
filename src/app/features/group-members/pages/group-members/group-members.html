<app-page-content>
  @if (loading()) {
    <app-page-loader />
  } @else if (members().length) {
    <app-members-list
      [members]="members()"
      [viewer]="viewer()"
      (roleClick)="changeRole($event)"
      (removeClick)="remove($event)"
    />
  } @else {
    <app-empty-state icon="group" message="Este grupo no tiene miembros." />
  }
</app-page-content>
