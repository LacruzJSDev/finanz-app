<h2>Rol de {{ data.member.name }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <app-input-group>
    <app-select
      label="Rol"
      [options]="roleOptions"
      formControlName="role"
      [error]="
        form.controls.role.invalid
          ? (form.controls.role.getError('server') ?? 'El rol es obligatorio.')
          : null
      "
    />
  </app-input-group>
  <p class="form-error">{{ formError() }}</p>

  <button appButton variant="filled" type="submit" [disabled]="submitting()">
    @if (submitting()) {
      <app-loader diameter="20" />
    } @else {
      Guardar
    }
  </button>
</form>
