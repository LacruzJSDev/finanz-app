<h2>Rol de {{ data.member.name }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="grouped-card">
    <mat-form-field>
      <mat-label>Rol</mat-label>
      <mat-select formControlName="role">
        @for (role of roles; track role) {
          <mat-option [value]="role">{{ role | memberRoleLabel }}</mat-option>
        }
      </mat-select>
      <mat-error>{{ form.controls.role.getError('server') ?? 'El rol es obligatorio.' }}</mat-error>
    </mat-form-field>
  </div>
  <p class="form-error">{{ formError() }}</p>

  <button matButton="filled" type="submit" [disabled]="submitting()">
    @if (submitting()) {
      <mat-spinner diameter="20" />
    } @else {
      Guardar
    }
  </button>
</form>
