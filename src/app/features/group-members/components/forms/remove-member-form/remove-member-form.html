<h2>{{ title() }}</h2>
<p>{{ message() }}</p>
<div class="actions">
  <button appButton variant="text" (click)="cancel()" [disabled]="submitting()">Cancelar</button>
  <button
    appButton
    variant="filled"
    class="remove-button"
    (click)="submit()"
    [disabled]="submitting()"
  >
    @if (submitting()) {
      <app-loader diameter="20" />
    } @else {
      {{ confirmLabel() }}
    }
  </button>
</div>
