<app-card appearance="outlined" layout="row" spacing="compact">
  <app-avatar [name]="member().name" />

  <div class="member-info">
    <span class="member-name">
      {{ member().name }}
      @if (isViewer()) {
        <span class="member-you">(tú)</span>
      }
    </span>
    <span class="member-email">{{ member().email }}</span>
  </div>

  <span class="member-role">{{ member().role | memberRoleLabel }}</span>

  @if (canChangeRole()) {
    <button appButton variant="icon" aria-label="Cambiar rol" (click)="roleClick.emit(member())">
      <app-icon name="manage_accounts" />
    </button>
  }

  @if (canRemove()) {
    <button
      appButton
      variant="icon"
      class="member-remove"
      [attr.aria-label]="isViewer() ? 'Abandonar el grupo' : 'Expulsar del grupo'"
      (click)="removeClick.emit(member())"
    >
      <app-icon [name]="isViewer() ? 'logout' : 'person_remove'" />
    </button>
  }
</app-card>
