<h2>Nuevo plan de pago</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <app-toggle-transaction-type [control]="form.controls.type" [options]="transactionTypes" />
  <app-amount-input [control]="form.controls.amount" [type]="type()" />

  <app-input-group>
    <app-text-input label="Concepto" formControlName="description" />

    <app-date-picker
      label="Primer vencimiento"
      formControlName="next_due_date"
      required
      [error]="
        form.controls.next_due_date.invalid
          ? (form.controls.next_due_date.getError('server') ?? 'La fecha es obligatoria.')
          : null
      "
    />

    @if (type() === 'transfer') {
      <app-select
        label="Cuenta destino"
        [options]="accountOptions"
        formControlName="to_account_id"
        [error]="
          form.controls.to_account_id.invalid
            ? (form.controls.to_account_id.getError('server') ??
              'La cuenta destino es obligatoria.')
            : null
        "
      />
    } @else {
      <app-category-select [control]="form.controls.category_id" [categories]="data.categories" />
    }
  </app-input-group>

  <app-input-group>
    <app-switch formControlName="is_recurring" labelPosition="before"> Se repite </app-switch>

    @if (recurring()) {
      <div class="field-pair">
        <app-text-input
          label="Cada"
          type="number"
          min="1"
          step="1"
          formControlName="frequency_interval"
        />

        <app-select label="Periodo" [options]="frequencyOptions" formControlName="frequency_unit" />
      </div>

      <app-date-picker
        label="Termina el (opcional)"
        formControlName="end_date"
        [error]="
          form.controls.end_date.invalid
            ? (form.controls.end_date.getError('server') ?? 'No puede ser antes del vencimiento.')
            : null
        "
      />
    }
  </app-input-group>

  <p class="form-error">{{ formError() }}</p>

  <button appButton variant="filled" type="submit" [disabled]="submitting()">
    @if (submitting()) {
      <app-loader diameter="20" />
    } @else {
      Guardar
    }
  </button>
</form>
