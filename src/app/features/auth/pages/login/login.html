<div class="auth-page">
  <h1>Login</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-input-group>
      <app-text-input
        label="Email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [error]="
          form.controls.email.invalid &&
          (form.controls.email.touched || form.controls.email.hasError('server'))
            ? form.controls.email.hasError('email')
              ? 'Email no válido.'
              : 'El email es obligatorio.'
            : null
        "
      />
      <app-text-input
        label="Contraseña"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [error]="
          form.controls.password.invalid &&
          (form.controls.password.touched || form.controls.password.hasError('server'))
            ? 'La contraseña es obligatoria.'
            : null
        "
      />
    </app-input-group>

    <p class="form-error">{{ errorMessage() }}</p>

    <button appButton variant="filled" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <app-loader diameter="20" />
      } @else {
        Entrar
      }
    </button>
  </form>
</div>
