<app-page-content>
  @if (loading()) {
    <app-page-loader />
  } @else {
    <div class="categories-content">
      @if (archivedCategories().length || showArchived()) {
        <button
          type="button"
          class="archived-toggle"
          [attr.aria-pressed]="showArchived()"
          (click)="showArchived.set(!showArchived())"
        >
          <app-icon [name]="showArchived() ? 'arrow_back' : 'archive'" />
          {{
            showArchived()
              ? 'Volver a categorías activas'
              : 'Ver categorías archivadas (' + archivedCategories().length + ')'
          }}
        </button>
      }
      @if ((showArchived() ? archivedCategories() : activeCategories()).length) {
        <app-categories-list
          [categories]="showArchived() ? archivedCategories() : activeCategories()"
          [blockedIds]="blockedIds()"
          [canManage]="canManage()"
          (editClick)="openUpdateCategoryForm($event)"
          (toggleActive)="toggleCategoryActive($event)"
        />
      } @else {
        <div class="categories-empty">
          <app-empty-state
            icon="category"
            [message]="
              showArchived() ? 'No hay categorías archivadas.' : 'No hay categorías activas.'
            "
            [hint]="
              showArchived()
                ? 'Puedes volver a las categorías activas.'
                : 'Crea la primera con el botón +.'
            "
          />
        </div>
      }

      @if (!showArchived() && canOfferStarters()) {
        <app-starter-categories
          [count]="pendingStarters().length"
          [creating]="creatingStarters()"
          (create)="createStarterCategories()"
        />
      }
    </div>
  }
</app-page-content>
