<div class="segmented-track">
  <mat-button-toggle-group [value]="filter()" (change)="filter.set($event.value)">
    <mat-button-toggle value="active">Activas</mat-button-toggle>
    <mat-button-toggle value="archived">Archivadas</mat-button-toggle>
  </mat-button-toggle-group>
</div>

<app-page-content>
  @if (loading()) {
    <app-page-loader />
  } @else if (visibleCategories().length) {
    <app-categories-list
      [categories]="visibleCategories()"
      [blockedIds]="blockedIds()"
      (editClick)="openUpdateCategoryForm($event)"
      (toggleActive)="toggleCategoryActive($event)"
    />
  } @else if (filter() === 'active') {
    <app-empty-state
      icon="category"
      message="No hay categorías activas."
      hint="Crea la primera con el botón +."
    />
  } @else {
    <app-empty-state
      icon="category"
      message="No hay categorías archivadas."
      hint="Las categorías que archives aparecerán aquí."
    />
  }
</app-page-content>
