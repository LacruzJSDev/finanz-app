<app-page-content>
  @if (loading()) {
    <app-page-loader />
  } @else {
    @if (activeCategories().length) {
      <app-categories-list
        [categories]="activeCategories()"
        [blockedIds]="blockedIds()"
        [canManage]="canManage()"
        (editClick)="openUpdateCategoryForm($event)"
        (toggleActive)="toggleCategoryActive($event)"
      />
    } @else {
      <div class="categories-empty">
        <app-empty-state
          icon="category"
          message="No hay categorías activas."
          hint="Crea la primera con el botón +."
        />
      </div>
    }

    @if (canOfferStarters()) {
      <app-starter-categories
        [count]="pendingStarters().length"
        [creating]="creatingStarters()"
        (create)="createStarterCategories()"
      />
    }

    @if (archivedCategories().length; as archivedCount) {
      <button type="button" class="archived-toggle" (click)="showArchived.set(!showArchived())">
        <mat-icon>{{ showArchived() ? 'expand_less' : 'expand_more' }}</mat-icon>
        {{
          archivedCount === 1 ? '1 categoría archivada' : archivedCount + ' categorías archivadas'
        }}
      </button>

      @if (showArchived()) {
        <app-categories-list
          [categories]="archivedCategories()"
          [blockedIds]="blockedIds()"
          [canManage]="canManage()"
          (editClick)="openUpdateCategoryForm($event)"
          (toggleActive)="toggleCategoryActive($event)"
        />
      }
    }
  }
</app-page-content>
