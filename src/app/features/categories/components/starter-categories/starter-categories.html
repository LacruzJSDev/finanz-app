<button appButton variant="text" type="button" [disabled]="creating()" (click)="create.emit()">
  @if (creating()) {
    <app-loader diameter="20" />
  } @else {
    <app-icon name="playlist_add" />
  }
  {{ creating() ? 'Creando categorías…' : 'Añadir categorías sugeridas' }}
</button>
<p class="starter-categories__hint">
  {{ summary() }} Luego se editan o se archivan como cualquier otra.
</p>
