<!-- Solo se puede desplegar si tiene subcategorías; si no, no hay nada que ver. -->
<app-disclosure
  [expandable]="hasChildren()"
  [expanded]="expanded()"
  (expandedChange)="onExpandedChange($event)"
>
  <span class="category-title" appDisclosureTitle>
    <app-color-icon [icon]="category().icon" [color]="category().color" [size]="48" />
    <span class="category-name">
      {{ category().name }}
      @if (isSubcategory()) {
        <span class="category-note">(Subcategoría)</span>
      }
    </span>
  </span>

  <div class="category-actions" appDisclosureActions>
    <!-- El número de subcategorías insinúa que la fila se puede desplegar. -->
    @if (hasChildren()) {
      <span class="child-count">{{ children().length }}</span>
    }
    @if (canManage()) {
      <button
        appButton
        variant="icon"
        aria-label="Editar categoría"
        (click)="editClick.emit(category())"
      >
        <app-icon name="edit" />
      </button>
      <app-switch
        class="toggle-sm"
        [checked]="category().is_active"
        [ariaLabel]="'Categoría activa: ' + category().name"
        [disabled]="isBlocked(category())"
        (changeSettled)="toggleActive.emit(category())"
      />
    }
  </div>

  @for (child of children(); track child.id) {
    <div class="category-row">
      <app-color-icon [icon]="child.icon" [color]="child.color" />
      <span class="category-name">{{ child.name }}</span>
      <div class="category-actions">
        @if (canManage()) {
          <button
            appButton
            variant="icon"
            aria-label="Editar subcategoría"
            (click)="editClick.emit(child)"
          >
            <app-icon name="edit" />
          </button>
          <app-switch
            class="toggle-sm"
            [checked]="child.is_active"
            [ariaLabel]="'Subcategoría activa: ' + child.name"
            [disabled]="isBlocked(child)"
            (changeSettled)="toggleActive.emit(child)"
          />
        }
      </div>
    </div>
  }
</app-disclosure>
