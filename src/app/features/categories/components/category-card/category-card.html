<!-- Solo se puede desplegar si tiene subcategorías; si no, no hay nada que ver. -->
<mat-expansion-panel
  [disabled]="!hasChildren()"
  hideToggle
  [expanded]="expanded()"
  (expandedChange)="onExpandedChange($event)"
>
  <mat-expansion-panel-header>
    <mat-panel-title>
      <app-color-icon [icon]="category().icon" [color]="category().color" [size]="48" />
      <span class="category-name">
        {{ category().name }}
        @if (isSubcategory()) {
          <span class="category-note">(Subcategoría)</span>
        }
      </span>
    </mat-panel-title>

    <div class="category-actions" (click)="$event.stopPropagation()">
      <!-- El número de subcategorías insinúa que la fila se puede desplegar. -->
      @if (hasChildren()) {
        <span class="child-count">{{ children().length }}</span>
      }
      @if (canManage()) {
        <button matIconButton (click)="editClick.emit(category())">
          <mat-icon>edit</mat-icon>
        </button>
        <mat-slide-toggle
          class="toggle-sm"
          [checked]="category().is_active"
          [disabled]="isBlocked(category())"
          (change)="toggleActive.emit(category())"
        />
      }
    </div>
  </mat-expansion-panel-header>

  @for (child of children(); track child.id) {
    <div class="category-row">
      <app-color-icon [icon]="child.icon" [color]="child.color" />
      <span class="category-name">{{ child.name }}</span>
      <div class="category-actions">
        @if (canManage()) {
          <button matIconButton (click)="editClick.emit(child)">
            <mat-icon>edit</mat-icon>
          </button>
          <mat-slide-toggle
            class="toggle-sm"
            [checked]="child.is_active"
            [disabled]="isBlocked(child)"
            (change)="toggleActive.emit(child)"
          />
        }
      </div>
    </div>
  }
</mat-expansion-panel>
