<h2>Editar categoría</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput type="text" formControlName="name" />
  </mat-form-field>

  @if (data.hasChildren) {
    <p>Esta categoría tiene subcategorías propias, no puede tener padre.</p>
  } @else {
    <mat-form-field appearance="outline">
      <mat-label>Categoría padre</mat-label>
      <mat-select formControlName="parent_id">
        <mat-option value="">Categoría raíz (sin padre)</mat-option>
        @for (category of data.rootCategories; track category.id) {
          <mat-option [value]="category.id">{{ category.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }

  <app-color-picker [selected]="form.controls.color.value" (colorChange)="selectColor($event)" />

  <app-icon-picker [selected]="form.controls.icon.value" (iconChange)="selectIcon($event)" />

  <mat-checkbox formControlName="is_active">Activa</mat-checkbox>

  <button matButton="filled" type="submit">Guardar</button>
</form>
