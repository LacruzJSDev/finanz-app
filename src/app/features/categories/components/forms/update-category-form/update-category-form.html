<h2>Editar categoría</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <input type="text" formControlName="name" placeholder="Nombre" />

  @if (data.hasChildren) {
    <p>Esta categoría tiene subcategorías propias, no puede tener padre.</p>
  } @else {
    <select formControlName="parent_id">
      <option value="">Categoría raíz (sin padre)</option>
      @for (category of data.rootCategories; track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
  }

  <input type="color" formControlName="color" />

  <app-icon-picker [selected]="form.controls.icon.value" (iconChange)="selectIcon($event)" />

  <label>
    <input type="checkbox" formControlName="is_active" />
    Activa
  </label>

  <button type="submit">Guardar</button>
</form>
