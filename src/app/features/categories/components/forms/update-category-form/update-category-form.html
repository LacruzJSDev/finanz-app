<h2>Editar categoría</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  @if (data.hasChildren) {
    <p class="form-note">Esta categoría tiene subcategorías propias, no puede tener padre.</p>
  }

  <app-input-group>
    <app-text-input
      label="Nombre"
      formControlName="name"
      [error]="
        form.controls.name.invalid &&
        (form.controls.name.touched || form.controls.name.hasError('server'))
          ? (form.controls.name.getError('server') ?? 'El nombre es obligatorio.')
          : null
      "
    />

    @if (!data.hasChildren) {
      <app-select label="Categoría padre" [options]="parentOptions()" formControlName="parent_id" />
    }

    <app-color-picker [selected]="form.controls.color.value" (colorChange)="selectColor($event)" />

    <app-icon-picker [selected]="form.controls.icon.value" (iconChange)="selectIcon($event)" />
  </app-input-group>
  <p class="form-error">{{ formError() }}</p>

  <button appButton variant="filled" type="submit" [disabled]="submitting()">
    @if (submitting()) {
      <app-loader diameter="20" />
    } @else {
      Guardar
    }
  </button>
</form>
