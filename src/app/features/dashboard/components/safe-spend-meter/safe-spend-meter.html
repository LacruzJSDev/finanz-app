<div class="meter-head">
  <span class="meter-label">Gasto diario seguro</span>
  <span class="meter-figures" [class.meter-figures--over]="overLimit()">
    {{ spent() }} / {{ limit() }}
  </span>
</div>

<app-progress
  class="meter-bar"
  [value]="progress()"
  [class.meter-bar--over]="overLimit()"
  label="Gasto diario seguro"
></app-progress>

<div class="meter-foot">
  @if (daysRemaining(); as days) {
    <span>{{ days }} {{ days === 1 ? 'día restante' : 'días restantes' }}</span>
  } @else {
    <span></span>
  }
  @if (overLimit()) {
    <span class="meter-over">Límite alcanzado</span>
  }
</div>
