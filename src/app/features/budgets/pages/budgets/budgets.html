<app-page-content>
  <app-month-stepper [month]="month()" (monthChange)="month.set($event)" />

  @if (loading()) {
    <app-page-loader />
  } @else if (budgets().length) {
    <section class="budgets-list" aria-label="Presupuestos vigentes">
      @for (group of budgetGroups(); track group.root?.id ?? group.budgets[0].category_id) {
        <section
          class="budget-group"
          [attr.aria-labelledby]="
            'budget-group-' + (group.root?.id ?? group.budgets[0].category_id)
          "
        >
          @if (group.root) {
            <h2 class="budget-group__title" [id]="'budget-group-' + group.root.id">
              <app-color-icon [icon]="group.root.icon" [color]="group.root.color" [size]="24" />
              <span>{{ group.root.name }}</span>
            </h2>
          }
          <div class="budget-group__items">
            @for (budget of group.budgets; track budget.category_id) {
              <app-budget-card
                [budget]="budget"
                [category]="categoryFor(budget)"
                [isChild]="!!parentFor(budget)"
                [canManage]="canManage()"
                (editClick)="openBudgetForm($event)"
                (deleteClick)="deleteBudget($event)"
              />
            }
          </div>
        </section>
      }
    </section>
  } @else {
    <app-empty-state
      icon="savings"
      message="No hay presupuestos vigentes."
      [hint]="
        canManage() ? 'Crea el primero con el botón +.' : 'Un administrador puede crear el primero.'
      "
    />
  }
</app-page-content>
