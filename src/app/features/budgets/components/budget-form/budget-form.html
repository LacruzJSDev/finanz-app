<h2>{{ selectedBudget() ? 'Editar presupuesto' : 'Nuevo presupuesto' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <app-input-group>
    <app-category-select
      [categories]="data.categories"
      [control]="form.controls.categoryId"
      [allowEmpty]="false"
    />
    <app-text-input
      label="Límite mensual (EUR)"
      type="number"
      min="0.01"
      step="0.01"
      formControlName="amount"
      [error]="
        form.controls.amount.invalid
          ? (form.controls.amount.getError('server') ?? 'Indica un importe mayor que cero.')
          : null
      "
    />
  </app-input-group>
  <p class="form-error">{{ formError() }}</p>
  <button appButton variant="filled" type="submit" [disabled]="submitting()">
    @if (submitting()) {
      <app-loader diameter="20" />
    } @else {
      Guardar
    }
  </button>
</form>
