<h2>Eliminar presupuesto</h2>
<p>Dejarás de tener un límite de gasto para {{ data.categoryName }}.</p>
<div class="actions">
  <button matButton (click)="cancel()" [disabled]="submitting()">Cancelar</button>
  <button matButton="filled" class="delete-button" (click)="submit()" [disabled]="submitting()">
    @if (submitting()) {
      <mat-spinner diameter="20" />
    } @else {
      Eliminar
    }
  </button>
</div>
