<h2>Eliminar presupuesto</h2>
<p>Dejarás de tener un límite de gasto para {{ data.categoryName }}.</p>
<div class="actions">
  <button appButton variant="text" (click)="cancel()" [disabled]="submitting()">Cancelar</button>
  <button
    appButton
    variant="filled"
    class="delete-button"
    (click)="submit()"
    [disabled]="submitting()"
  >
    @if (submitting()) {
      <app-loader diameter="20" />
    } @else {
      Eliminar
    }
  </button>
</div>
