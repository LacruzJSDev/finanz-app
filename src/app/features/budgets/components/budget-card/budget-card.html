<app-card appearance="outlined" layout="row" spacing="compact">
  <app-color-icon icon="savings" color="var(--app-color-danger)" [size]="40" />
  <div class="budget-info">
    <span class="budget-title">{{ budget().category_name }}</span>
    <span class="budget-meta"
      >{{ budget().spent | centsToEuros }} de {{ budget().amount | centsToEuros }}</span
    >
    <app-progress [value]="progress()" [class.budget-progress--over]="isOverBudget()" />
  </div>
  <span class="budget-percentage">{{ budget().percentage }}%</span>
  @if (canManage()) {
    <button
      appButton
      variant="icon"
      (click)="editClick.emit(budget())"
      aria-label="Editar presupuesto"
    >
      <app-icon name="edit" />
    </button>
    <button
      appButton
      variant="icon"
      aria-label="Eliminar presupuesto"
      class="budget-delete"
      (click)="deleteClick.emit(budget())"
    >
      <app-icon name="delete" />
    </button>
  }
</app-card>
