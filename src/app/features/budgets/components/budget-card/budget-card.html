<app-card
  appearance="outlined"
  layout="row"
  spacing="compact"
  [class.budget-card--child]="isChild()"
>
  <app-color-icon
    [icon]="category()?.icon ?? 'savings'"
    [color]="category()?.color ?? 'var(--app-color-muted)'"
    [size]="40"
  />
  <div class="budget-info">
    <span class="budget-title">{{ budget().category_name }}</span>
    <span class="budget-meta"
      >{{ budget().spent | centsToEuros }} de {{ budget().amount | centsToEuros }}</span
    >
    <app-progress [value]="progress()" [class]="'budget-progress--' + progressTone()" />
  </div>
  <span class="budget-percentage">{{ budget().percentage | number: '1.0-0' }}%</span>
  @if (canManage()) {
    <button
      appButton
      variant="icon"
      (click)="editClick.emit(budget())"
      aria-label="Editar presupuesto"
    >
      <app-icon name="edit" />
    </button>
    <button
      appButton
      variant="icon"
      aria-label="Eliminar presupuesto"
      class="budget-delete"
      (click)="deleteClick.emit(budget())"
    >
      <app-icon name="delete" />
    </button>
  }
</app-card>
