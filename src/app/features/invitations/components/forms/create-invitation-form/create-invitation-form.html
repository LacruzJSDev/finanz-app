@if (code(); as code) {
  <h2>Invitación creada</h2>
  <p class="invite-hint">
    Comparte este código con quien quieras que entre. Puedes volver a copiarlo desde la lista
    mientras nadie lo use.
  </p>

  <p class="invite-code">{{ code }}</p>

  <button appButton variant="filled" class="invite-copy" (click)="copy()">
    <app-icon [name]="copied() ? 'check' : 'content_copy'" />
    {{ copied() ? 'Copiado' : 'Copiar código' }}
  </button>
  <button appButton variant="text" (click)="close()">Cerrar</button>
} @else {
  <h2>Invitar al grupo</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-input-group>
      <app-select
        label="Rol con el que entrará"
        [options]="roleOptions"
        formControlName="role"
        [error]="
          form.controls.role.invalid
            ? (form.controls.role.getError('server') ?? 'El rol es obligatorio.')
            : null
        "
      />
    </app-input-group>
    <p class="form-error">{{ formError() }}</p>

    <button appButton variant="filled" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <app-loader diameter="20" />
      } @else {
        Crear invitación
      }
    </button>
  </form>
}
