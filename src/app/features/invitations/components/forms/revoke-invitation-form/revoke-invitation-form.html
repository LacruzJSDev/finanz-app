<h2>Revocar la invitación</h2>
<p>
  El código dejará de funcionar. Si alguien lo tenía guardado, ya no podrá entrar con él; tendrás
  que crear otra invitación.
</p>
<div class="actions">
  <button appButton variant="text" (click)="cancel()" [disabled]="submitting()">Cancelar</button>
  <button
    appButton
    variant="filled"
    class="revoke-button"
    (click)="submit()"
    [disabled]="submitting()"
  >
    @if (submitting()) {
      <app-loader diameter="20" />
    } @else {
      Revocar
    }
  </button>
</div>
