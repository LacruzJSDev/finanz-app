<div class="icon-picker">
  @for (icon of icons; track icon) {
    <button
      type="button"
      [class.selected]="icon === selected()"
      (click)="iconChange.emit(icon)"
      [title]="icon | iconLabel"
    >
      <mat-icon>{{ icon }}</mat-icon>
      <span class="icon-label">{{ icon | iconLabel }}</span>
    </button>
  }
</div>
