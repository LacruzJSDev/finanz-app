<mat-form-field>
  <mat-label>Icono</mat-label>
  <mat-select [value]="selected()" (selectionChange)="iconChange.emit($event.value)">
    <mat-select-trigger>
      @if (selected(); as icon) {
        <mat-icon>{{ icon }}</mat-icon>
        {{ labels[icon] }}
      }
    </mat-select-trigger>
    @for (icon of icons; track icon) {
      <mat-option [value]="icon">
        <mat-icon>{{ icon }}</mat-icon>
        {{ labels[icon] }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
